# Build first: docker compose build
# Default: main.py (mic). From WAV: docker compose run voice_processing python3 /app/jetson_test/main_file.py
# ORCHESTRATOR_URL: default http://localhost:8000 works when orchestrator runs on same host (network_mode: host).
#   If orchestrator is on another machine, set ORCHESTRATOR_URL=http://<that-host-ip>:8000. TTS output is not written to file.
services:
  voice_processing:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice_processing:latest
    container_name: voice_processing
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MIC_DEVICE_NAME=${MIC_DEVICE_NAME:-pulse}
      - AUDIO_SAMPLE_RATE=${AUDIO_SAMPLE_RATE:-48000}
      - AUDIO_CHUNK=${AUDIO_CHUNK:-3072}
      - AUDIO_LATENCY=${AUDIO_LATENCY:-0.40}
      - AUDIO_STATUS_LOG_INTERVAL=${AUDIO_STATUS_LOG_INTERVAL:-2.0}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-1}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-1}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-1}
      - NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-1}
      - VECLIB_MAXIMUM_THREADS=${VECLIB_MAXIMUM_THREADS:-1}
      - OMP_WAIT_POLICY=${OMP_WAIT_POLICY:-PASSIVE}
      - ORT_INTRA_OP_NUM_THREADS=${ORT_INTRA_OP_NUM_THREADS:-1}
      - ORT_INTER_OP_NUM_THREADS=${ORT_INTER_OP_NUM_THREADS:-1}
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-1}
      - TORCH_NUM_INTEROP_THREADS=${TORCH_NUM_INTEROP_THREADS:-1}
      - PULSE_SOURCE
      - PULSE_SINK
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      - PULSE_LATENCY_MSEC=${PULSE_LATENCY_MSEC:-300}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://localhost:8000}
      - TTS_CHUNK_COUNT=${TTS_CHUNK_COUNT:-5}
      - STT_BACKEND=${STT_BACKEND:-whisper}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_STT_MODEL=${OPENAI_STT_MODEL:-gpt-4o-transcribe}
      - OPENAI_STT_TIMEOUT=${OPENAI_STT_TIMEOUT:-20}
      - OPENAI_STT_PROMPT=${OPENAI_STT_PROMPT:-}
      - OPENAI_TRANSCRIPTIONS_URL=${OPENAI_TRANSCRIPTIONS_URL:-https://api.openai.com/v1/audio/transcriptions}
      - NEMOTRON_MODEL_ID=${NEMOTRON_MODEL_ID:-nvidia/nemotron-speech-streaming-en-0.6b}
      - STT_LANGUAGE=${STT_LANGUAGE:-}
    volumes:
      - ./output:/app/output
      - ./input_test:/app/input_test
      - ./:/app
      - ${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse
      - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
